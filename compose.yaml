# 웹(완성본)을 Docker 로 띄워, Docker 로 띄운 BE 에 붙여 테스트한다.
#   1. BE 먼저: BE 폴더에서 docker compose up -d   (BE·DB·Redis, 네트워크 be-nerdnam_default 가 생긴다)
#   2. 웹:      이 폴더에서 docker compose up --build -d   → http://localhost:3000
#   코드 변경 후: docker compose up --build -d
#   종료:       docker compose down
#
# 웹 컨테이너는 BE 와 같은 Docker 네트워크에 들어가 BE 를 http://api:8080 으로 부른다(api = BE compose 의 서비스 이름).
# 브라우저는 웹(3000)에만 요청하고, 웹이 BE 로 대신 전달한다. 로그인 쿠키도 그대로 따라간다.
# 로그인은 BE .env 에 구글·카카오 키가 있어야 끝까지 된다 (BE 레포 docs/11-Docker-Compose-실행.md).
services:
  web:
    build:
      context: .
      args:
        API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - be

networks:
  be:
    external: true
    # BE 폴더 이름이 다르면 네트워크 이름도 달라진다: BE_NETWORK=다른이름_default docker compose up
    name: ${BE_NETWORK:-be-nerdnam_default}
